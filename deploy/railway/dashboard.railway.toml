# Point each Railway service at this file (Settings → Config-as-code path):
# /deploy/railway/dashboard.railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["polymarket_mm_bot/**", "Dockerfile", "pyproject.toml", "alembic/**"]

[deploy]
startCommand = "python -m polymarket_mm_bot.dashboard.server"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
