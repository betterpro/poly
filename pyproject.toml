[project]
name = "polymarket-mm-bot"
version = "0.1.0"
description = "Low-risk Polymarket spread-capture and market-making bot with paper trading by default."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13.0",
  "asyncpg>=0.29.0",
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.1.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-dotenv>=1.0.0",
  "redis>=5.0.0",
  "sqlalchemy>=2.0.0",
  "structlog>=24.1.0",
  "uvicorn[standard]>=0.30.0",
  "websockets>=12.0",
]

[project.optional-dependencies]
live = ["py-clob-client-v2>=0.1.0"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["polymarket_mm_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
