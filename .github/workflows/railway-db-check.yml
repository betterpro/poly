name: Railway DB Check

on:
  workflow_dispatch:
  push:
    branches: [claude/railway-db-check-5jc8q8]
    paths: [".github/workflows/railway-db-check.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Fetch database URL from Railway
        run: |
          railway variables --service Postgres --json > /tmp/pg_vars.json
          DB_URL=$(jq -r '.DATABASE_PUBLIC_URL // .DATABASE_URL' /tmp/pg_vars.json)
          PG_PASSWORD=$(jq -r '.PGPASSWORD // empty' /tmp/pg_vars.json)
          echo "::add-mask::$DB_URL"
          if [ -n "$PG_PASSWORD" ]; then echo "::add-mask::$PG_PASSWORD"; fi
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Run database checks
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '=== Server version ==='
          SELECT version();
          \echo '=== Database size ==='
          SELECT current_database() AS database,
                 pg_size_pretty(pg_database_size(current_database())) AS size;
          \echo '=== Connections ==='
          SELECT count(*) AS total_connections,
                 count(*) FILTER (WHERE state = 'active') AS active
          FROM pg_stat_activity;
          \echo '=== Alembic migration version ==='
          SELECT * FROM alembic_version;
          \echo '=== Tables and approximate row counts ==='
          SELECT relname AS table_name,
                 n_live_tup AS approx_rows,
                 pg_size_pretty(pg_total_relation_size(relid)) AS total_size
          FROM pg_stat_user_tables
          ORDER BY n_live_tup DESC;
          \echo '=== Most recent PnL snapshots ==='
          SELECT timestamp, daily_pnl, total_pnl, unrealized_pnl
          FROM pnl_snapshots ORDER BY timestamp DESC LIMIT 5;
          \echo '=== Most recent trades (bot fills) ==='
          SELECT timestamp, market_id, side, price, size
          FROM trades ORDER BY timestamp DESC LIMIT 10;
          SQL

      - name: Show recent fills and PnL from status snapshot
        run: |
          psql "$DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          \echo '=== Snapshot status / PnL ==='
          SELECT status_json->>'updated_at' AS updated_at,
                 status_json->>'bot_status' AS bot_status,
                 status_json->>'realized_pnl' AS realized_pnl,
                 status_json->>'unrealized_pnl' AS unrealized_pnl,
                 status_json->>'total_pnl' AS total_pnl,
                 status_json->>'daily_pnl' AS daily_pnl
          FROM bot_config WHERE id = 1;
          \echo '=== Last 10 fills (newest first) ==='
          SELECT jsonb_pretty(COALESCE(jsonb_agg(elem ORDER BY ord DESC), '[]'::jsonb))
          FROM (
            SELECT elem, ord
            FROM bot_config,
                 jsonb_array_elements((status_json::jsonb)->'recent_fills') WITH ORDINALITY AS t(elem, ord)
            WHERE id = 1
            ORDER BY ord DESC
            LIMIT 10
          ) s;
          \echo '=== Positions in snapshot ==='
          SELECT jsonb_pretty(COALESCE((status_json::jsonb)->'positions', '[]'::jsonb))
          FROM bot_config WHERE id = 1;
          SQL

      - name: Check dashboard health endpoint
        if: always()
        run: |
          DOMAIN=$(railway variables --service dashboard --json | jq -r '.RAILWAY_PUBLIC_DOMAIN // empty')
          if [ -n "$DOMAIN" ]; then
            echo "Dashboard domain: $DOMAIN"
            curl -sS -m 30 "https://$DOMAIN/health" | jq .
          else
            echo "No public domain configured for dashboard service."
          fi
