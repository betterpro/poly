name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/polymarket-mm
  IMAGE_NAME: bot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DOCR
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Generate app spec
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          POLYMARKET_API_KEY: ${{ secrets.POLYMARKET_API_KEY }}
          POLYMARKET_API_SECRET: ${{ secrets.POLYMARKET_API_SECRET }}
          POLYMARKET_API_PASSPHRASE: ${{ secrets.POLYMARKET_API_PASSPHRASE }}
          POLYMARKET_PRIVATE_KEY: ${{ secrets.POLYMARKET_PRIVATE_KEY }}
          POLYMARKET_FUNDER_ADDRESS: ${{ secrets.POLYMARKET_FUNDER_ADDRESS }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          template = Path("deploy/app.image.template.yaml").read_text()
          db_url = os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://").strip('"')
          replacements = {
              "__DATABASE_URL__": db_url,
              "__POLYMARKET_API_KEY__": os.environ["POLYMARKET_API_KEY"],
              "__POLYMARKET_API_SECRET__": os.environ["POLYMARKET_API_SECRET"].strip('"'),
              "__POLYMARKET_API_PASSPHRASE__": os.environ["POLYMARKET_API_PASSPHRASE"],
              "__POLYMARKET_PRIVATE_KEY__": os.environ["POLYMARKET_PRIVATE_KEY"],
              "__POLYMARKET_FUNDER_ADDRESS__": os.environ["POLYMARKET_FUNDER_ADDRESS"],
          }
          for key, value in replacements.items():
              template = template.replace(key, value)
          Path("deploy/app-spec.generated.yaml").write_text(template)
          PY

      - name: Deploy app
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="polymarket-mm-bot"{print $1; exit}')
          if [ -n "$APP_ID" ]; then
            doctl apps update "$APP_ID" --spec deploy/app-spec.generated.yaml --wait
          else
            doctl apps create --spec deploy/app-spec.generated.yaml --wait
          fi

      - name: Print app URL
        run: |
          APP_ID=$(doctl apps list --format ID,Spec.Name --no-header | awk '$2=="polymarket-mm-bot"{print $1; exit}')
          doctl apps get "$APP_ID" --format DefaultIngress --no-header
