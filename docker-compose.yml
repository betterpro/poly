services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polymarket_mm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  dashboard:
    build: .
    env_file: .env
    command: uvicorn polymarket_mm_bot.dashboard.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  bot:
    build: .
    env_file: .env
    command: python -m polymarket_mm_bot.main
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
