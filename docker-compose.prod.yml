services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  dashboard:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: uvicorn polymarket_mm_bot.dashboard.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: python -m polymarket_mm_bot.main
    depends_on:
      - redis
    restart: unless-stopped
